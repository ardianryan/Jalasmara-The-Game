name: jalasmara-dev
services:
  mongo:
    image: mongo:8.0
    command: [mongod, --replSet, rs0, --bind_ip_all, --port, "27018"]
    ports: ['127.0.0.1:27018:27018']
    volumes: [mongo-dev:/data/db]
  mongo-init:
    image: mongo:8.0
    depends_on: [mongo]
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        until mongosh --host mongo:27018 --quiet --eval 'db.adminCommand({ping:1})'; do sleep 1; done
        mongosh --host mongo:27018 --quiet --eval 'try { rs.status() } catch (e) { if(e.codeName === "NotYetInitialized") rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27018"}]}); else throw e; }'
  redis:
    image: redis:7.4-alpine
    ports: ['127.0.0.1:6380:6379']
volumes:
  mongo-dev:
