# Optional identity services. External proxy is managed separately by the owner.
services:
  zitadel-postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_DB: zitadel
      POSTGRES_PASSWORD: ${ZITADEL_POSTGRES_PASSWORD:?Set ZITADEL_POSTGRES_PASSWORD}
    volumes: [zitadel-postgres:/var/lib/postgresql/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U zitadel -d zitadel']
      interval: 10s
      timeout: 5s
      retries: 15
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.16.0
    restart: unless-stopped
    user: '0'
    command: [start-from-init, --masterkey, '${ZITADEL_MASTERKEY:?Set a 32-character ZITADEL_MASTERKEY}']
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN:?Set ZITADEL_DOMAIN}
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: 'true'
      ZITADEL_TLS_ENABLED: 'false'
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: ${ZITADEL_POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: ${ZITADEL_POSTGRES_PASSWORD}
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Jalasmara
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_BOOTSTRAP_EMAIL:?Set bootstrap email}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_BOOTSTRAP_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_BOOTSTRAP_PASSWORD:?Set bootstrap password}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: 'true'
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Jalasmara Login Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${ZITADEL_LOGIN_PAT_EXPIRY:?Set PAT expiry RFC3339}
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: 'true'
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${ZITADEL_DOMAIN}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${ZITADEL_DOMAIN}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${ZITADEL_DOMAIN}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: https://${ZITADEL_DOMAIN}/ui/v2/login/login?samlRequest=
    volumes: [zitadel-bootstrap:/zitadel/bootstrap]
    ports: ['${ZITADEL_BIND:-127.0.0.1}:${ZITADEL_API_PORT:-8080}:8080']
    networks: [data, egress]
    depends_on:
      zitadel-postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, /app/zitadel, ready]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 15
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.16.0
    restart: unless-stopped
    user: '0'
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: 'Host:${ZITADEL_DOMAIN},X-Forwarded-Proto:https'
    volumes: [zitadel-bootstrap:/zitadel/bootstrap:ro]
    ports: ['${ZITADEL_BIND:-127.0.0.1}:${ZITADEL_LOGIN_PORT:-3002}:3000']
    networks: [data, egress]
    depends_on:
      zitadel-api: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, /app/healthcheck.mjs, 'http://localhost:3000/ui/v2/login/healthy']
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 15
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
volumes:
  zitadel-postgres:
  zitadel-bootstrap:
