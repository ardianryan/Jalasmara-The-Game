name: Manual CodeQL diagnosis

on:
  workflow_dispatch:

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: node:22-bookworm-slim
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install tools before Git checkout
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl gzip ca-certificates
      - name: Checkout exact source
        uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install dependencies and diagnose security findings
        run: |
          npm ci
          bash ci/codeql.sh
      - name: Preserve SARIF on Gitea
        if: always()
        uses: https://github.com/actions/upload-artifact@v3
        with:
          name: security-diagnosis
          path: reports/
          retention-days: 14
