name: Jalasmara verification and delivery

on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jalasmara-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: node:22-bookworm-slim
    services:
      redis:
        image: redis:7.4-alpine
    env:
      DEBIAN_FRONTEND: noninteractive
      TEST_MONGO_URL: mongodb://mongo:27018/jalasmara_ci?replicaSet=rs0
      TEST_REDIS_URL: redis://redis:6379/14
      npm_config_cache: /tmp/jalasmara-npm
    steps:
      - name: Install tools before Git checkout
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 python3-pil git curl unzip gzip gpg ca-certificates libfontconfig1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libasound2
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trust this container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Start isolated test MongoDB and record source
        run: |
          bash ci/start-test-mongo.sh
          mkdir -p reports
          git rev-parse HEAD > reports/source-commit.txt
          node -e 'console.log("Runner memory MiB:", Math.round(require("os").totalmem()/1048576))'
      - name: Verify API, host, tooling and dependencies
        run: bash ci/verify.sh
      - name: CodeQL security analysis
        run: bash ci/codeql.sh
      - name: Export Godot and verify world
        run: bash ci/setup-godot.sh
      - name: Build web and API
        run: |
          npm run build -w @jalasmara/web
          npm run build -w @jalasmara/api
      - name: Prepare verified delivery bundle
        run: |
          python3 scripts/test_ci_oci_delivery.py -v
          python3 scripts/package-web-release.py \
            --output .runtime/github-delivery \
            --export-source "$(git rev-parse HEAD)"
          python3 scripts/ci_oci_delivery.py record-runtime \
            --repo . \
            --output .runtime/github-delivery/runtime-files.json \
            --source "$(git rev-parse HEAD)"
      - name: Preserve reports even when verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Store verified delivery bundle
        uses: actions/upload-artifact@v4
        with:
          name: verified-delivery
          path: .runtime/github-delivery/
          if-no-files-found: error
          retention-days: 3

  build-full-source-image:
    needs: verify-build-delivery
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout exact release verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Download verified release context
        uses: actions/download-artifact@v4
        with:
          name: verified-delivery
          path: .runtime/github-delivery
      - name: Verify source, context and compiled runtime records
        run: |
          python3 scripts/test_ci_oci_delivery.py -v
          python3 scripts/ci_oci_delivery.py prepare \
            --bundle .runtime/github-delivery \
            --output .runtime/github-oci-context \
            --source "$GITHUB_SHA"
      - name: Build and compare complete API, web and game image
        run: |
          set -euo pipefail
          TASK_IMAGE="jalasmara:ci-${GITHUB_SHA}"
          docker build --platform linux/amd64 --provenance=false --sbom=false \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$TASK_IMAGE" .runtime/github-oci-context
          mkdir -p .runtime/github-oci-delivery
          python3 scripts/ci_oci_delivery.py verify-image \
            --bundle .runtime/github-delivery \
            --image "$TASK_IMAGE" \
            --output .runtime/github-oci-delivery/image-proof.json \
            --source "$GITHUB_SHA"
          docker save "$TASK_IMAGE" | gzip -1 > .runtime/github-oci-delivery/image.tar.gz
          gzip -t .runtime/github-oci-delivery/image.tar.gz
          cp .runtime/github-delivery/manifest.json .runtime/github-oci-delivery/release-manifest.json
          cp .runtime/github-delivery/runtime-files.json .runtime/github-oci-delivery/runtime-files.json
          python3 scripts/ci_oci_delivery.py seal \
            --bundle .runtime/github-delivery \
            --proof .runtime/github-oci-delivery/image-proof.json \
            --archive .runtime/github-oci-delivery/image.tar.gz \
            --output .runtime/github-oci-delivery/oci-manifest.json \
            --source "$GITHUB_SHA"
          python3 scripts/ci_oci_delivery.py verify-bundle \
            --directory .runtime/github-oci-delivery \
            --source "$GITHUB_SHA"
      - name: Store complete source image
        uses: actions/upload-artifact@v4
        with:
          name: full-source-image
          path: .runtime/github-oci-delivery/
          if-no-files-found: error
          retention-days: 3
